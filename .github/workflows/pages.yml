# Depoyu GitHub Pages'e yayınlar.
#
# TEK SEFERLİK KURULUM: Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions" seçilmelidir. Actions'ın GITHUB_TOKEN'ı Pages sitesini
# *oluşturma* yetkisine sahip değildir (aşağıdaki enablement: true yalnızca
# site zaten varsa işe yarar), bu yüzden ilk açılış elle yapılır.
# Sonrasında her push otomatik yayınlanır.
name: GitHub Pages

on:
  push:
    branches:
      - claude/dtf-site-draft-eprfy6   # deponun varsayılan dalı
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages'i yapılandır (gerekirse etkinleştir)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          touch _site/.nojekyll
          ls -la _site _site/sinyal-haritasi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
